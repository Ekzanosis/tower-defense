<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tower Defense — ландшафт v15</title><style>body{margin:0;background:#172721;color:#f9eacb;font:16px system-ui}header{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px;background:#24372c}button{background:#493b27;border:2px solid #bda46a;border-radius:8px;color:#fff0c8;padding:9px 13px;cursor:pointer}button.on{background:#816028}main{max-width:1280px;margin:auto}canvas{width:100%;display:block;touch-action:manipulation;border:3px solid #94784d;box-sizing:border-box}small{display:block;padding:8px 12px;color:#d7d3b9}#msg{padding:8px 12px}</style><main><header><b>🏰 Ландшафт · v15</b><button id="one" class="on">Уровень 1</button><button id="two">Уровень 2</button><button id="tower" class="on">🏹 Башня · 60</button><button id="wall">🧱 Баррикада · 40</button><button id="clear">Очистить</button><span id="money">⚡ 300</span><button id="home">Основная игра</button></header><canvas id="c" width="1200" height="700"></canvas><div id="msg">Выбери место на траве для строительства. Дороги и декорации заблокированы.</div><small>Тест ландшафта и строительства. Враги и волны пока остаются в основной версии. Уровень 1: три отдельных маршрута. Уровень 2: A и B соединяются, C идёт отдельно. Дороги ведут к кристаллу.</small></main><script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=1200,H=700;let level=1,tool='tower',money=300,build=[];const $=id=>document.getElementById(id);
const maps=[
{routes:[[[20,120],[180,95],[300,155],[445,210],[610,172],[760,230],[910,230],[1010,345],[1100,350]],[[20,345],[180,325],[345,350],[510,395],[675,355],[835,370],[970,355],[1100,350]],[[20,590],[175,570],[300,610],[470,555],[625,600],[785,540],[920,490],[1030,420],[1100,350]]],crystal:[1100,350]},
{routes:[[[20,95],[145,100],[260,145],[345,220]],[[20,320],[140,330],[245,290],[345,220]],[[20,605],[155,575],[290,605],[445,565],[600,600],[735,545],[880,545],[985,450],[1100,350]]],shared:[[345,220],[475,260],[600,220],[735,175],[840,230],[805,330],[910,380],[1020,355],[1100,350]],crystal:[1100,350]}];
const rand=(a,b)=>{let n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)};function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}function line(pts,w,color){g.beginPath();g.moveTo(...pts[0]);for(let i=1;i<pts.length-1;i++){let mid=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2];g.quadraticCurveTo(...pts[i],...mid)}g.lineTo(...pts.at(-1));g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.strokeStyle=color;g.stroke()}
function segments(p){let out=[];for(let i=0;i<p.length-1;i++)out.push([p[i],p[i+1]]);return out}function distance(x,y,a,b){let vx=b[0]-a[0],vy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*vx+(y-a[1])*vy)/(vx*vx+vy*vy)));return Math.hypot(x-a[0]-t*vx,y-a[1]-t*vy)}
function roads(){let m=maps[level-1];return [...m.routes,...(m.shared?[m.shared]:[])]}function nearRoad(x,y,r=42){return roads().some(p=>segments(p).some(([a,b])=>distance(x,y,a,b)<r))}
function tree(x,y,s=1,orange=false){ellipse(x+6,y+17,25*s,11*s,'#203e2a88');g.fillStyle='#705138';g.fillRect(x-5*s,y-2*s,10*s,26*s);for(let [dx,dy,r] of [[-16,-12,18],[14,-14,19],[0,-30,24],[0,-11,19]]){ellipse(x+dx*s,y+dy*s,r*s,r*.75*s,orange?'#c77b2e':'#255f38');ellipse(x+(dx-4)*s,y+(dy-5)*s,r*.72*s,r*.47*s,orange?'#e4a044':'#438a48')}}
function rock(x,y,s=1){g.fillStyle='#606b64';g.beginPath();g.moveTo(x-23*s,y+12*s);g.lineTo(x-15*s,y-14*s);g.lineTo(x+5*s,y-23*s);g.lineTo(x+25*s,y-8*s);g.lineTo(x+28*s,y+14*s);g.closePath();g.fill();g.fillStyle='#a8aa91';g.beginPath();g.moveTo(x-15*s,y-14*s);g.lineTo(x+5*s,y-23*s);g.lineTo(x+12*s,y-5*s);g.lineTo(x-5*s,y+2*s);g.closePath();g.fill()}
function scenery(){g.fillStyle='#6a9d42';g.fillRect(0,0,W,H);for(let y=0;y<H;y+=23)for(let x=0;x<W;x+=25){let r=rand(x,y);g.fillStyle=r>.6?'#79aa4c':'#5e9542';g.globalAlpha=.3;g.fillRect(x,y,22,20);g.globalAlpha=1;if(r>.83){g.fillStyle='#d4d273';g.fillRect(x+9,y+8,3,3)}}g.fillStyle='#205b67';g.beginPath();g.moveTo(0,675);g.bezierCurveTo(240,620,320,735,570,675);g.bezierCurveTo(810,620,920,730,1200,650);g.lineTo(1200,700);g.lineTo(0,700);g.fill();for(let i=0;i<24;i++){let x=i*53,y=675+Math.sin(i*1.8)*12;ellipse(x,y,15,3,'#82d5c3')}for(let i=0;i<85;i++){let x=rand(i,4)*W,y=rand(i,5)*H;if(nearRoad(x,y,65)||x>1020&&y>250&&y<480||y>635)continue;let k=rand(i,6);if(k<.32)rock(x,y,.45+rand(i,8)*.65);else if(k<.69)tree(x,y,.45+rand(i,9)*.55,k>.62);else{ellipse(x,y,9,5,'#366e32');for(let j=0;j<4;j++)ellipse(x+rand(i,j)*16-8,y+rand(j,i)*9-4,2,2,j%2?'#f6d5e4':'#f7e4a0')}}}
function drawRoad(p){line(p,75,'#426e39');line(p,66,'#9a8151');line(p,59,'#e0b977');line(p,51,'#edc88a');g.setLineDash([2,15]);line(p,2,'#fff0be88');g.setLineDash([])}
function crystal(x,y){ellipse(x,y+35,66,25,'#253b39a0');for(let i=0;i<3;i++){ellipse(x,y+25-i*7,55-i*8,23-i*3,i%2?'#9b9c8c':'#555e63')}g.fillStyle='#4ac7ff';g.shadowColor='#33baff';g.shadowBlur=30;g.beginPath();g.moveTo(x,y-88);g.lineTo(x+33,y-35);g.lineTo(x+19,y+20);g.lineTo(x,y+42);g.lineTo(x-25,y+15);g.lineTo(x-31,y-33);g.closePath();g.fill();g.shadowBlur=0;g.strokeStyle='#d9f9ff';g.lineWidth=4;g.stroke();g.beginPath();g.moveTo(x,y-88);g.lineTo(x,y+40);g.lineTo(x+33,y-35);g.stroke()}
function gate(x,y,t){g.fillStyle='#583c27';g.fillRect(x-23,y-30,8,50);g.fillRect(x+15,y-30,8,50);g.fillStyle='#ab2525';g.beginPath();g.moveTo(x-17,y-33);g.lineTo(x+17,y-33);g.lineTo(x+17,y+10);g.lineTo(x,y+23);g.lineTo(x-17,y+10);g.fill();g.fillStyle='#ffe5a3';g.font='bold 27px Georgia';g.textAlign='center';g.fillText(t,x,y+2)}
function grid(){g.strokeStyle='#e6d78a38';g.lineWidth=1;for(let x=0;x<W;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}}
function draw(){scenery();for(let p of roads())drawRoad(p);grid();let m=maps[level-1];for(let i=0;i<3;i++)gate(45,m.routes[i][0][1]-38,'ABC'[i]);crystal(...m.crystal);for(let b of build){ellipse(b.x,b.y+13,24,9,'#1a382a99');if(b.type==='tower'){g.fillStyle='#b9a98b';g.fillRect(b.x-15,b.y-22,30,37);g.fillStyle='#9b4a36';g.beginPath();g.moveTo(b.x-24,b.y-22);g.lineTo(b.x,b.y-48);g.lineTo(b.x+24,b.y-22);g.fill();g.fillStyle='#f4d98a';g.fillRect(b.x-4,b.y-15,8,12)}else{g.fillStyle='#929b91';g.fillRect(b.x-10,b.y-32,20,62);g.fillStyle='#d1d0b6';for(let k=-25;k<30;k+=15)g.fillRect(b.x-10,b.y+k,20,4)}}}
function setLevel(n){level=n;build=[];money=300;$('one').classList.toggle('on',n===1);$('two').classList.toggle('on',n===2);$('money').textContent='⚡ '+money;draw()}
$('one').onclick=()=>setLevel(1);$('two').onclick=()=>setLevel(2);$('tower').onclick=()=>{tool='tower';$('tower').classList.add('on');$('wall').classList.remove('on')};$('wall').onclick=()=>{tool='wall';$('wall').classList.add('on');$('tower').classList.remove('on')};$('clear').onclick=()=>setLevel(level);$('home').onclick=()=>location.href='index.html';
c.addEventListener('click',e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height,cost=tool==='tower'?60:40;if(nearRoad(x,y,49)||x>1020&&y>255&&y<465||y>640||build.some(b=>Math.hypot(b.x-x,b.y-y)<48)){$('msg').textContent='Здесь строить нельзя: дорога, кристалл или другое сооружение.';return}if(money<cost){$('msg').textContent='Недостаточно энергии.';return}build.push({x,y,type:tool});money-=cost;$('money').textContent='⚡ '+money;$('msg').textContent='Построено: '+(tool==='tower'?'башня':'баррикада');draw()});
/* v15: richer painted environment and ornamentation */
function fir(x,y,z=1){g.save();g.translate(x,y);g.scale(z,z);ellipse(5,20,26,10,'#173a27aa');g.fillStyle='#65492b';g.fillRect(-5,-15,10,40);for(let i=0;i<4;i++){let yy=-53+i*16,w=14+i*8;g.fillStyle=['#2d7845','#23673c','#38874b','#1d6039'][i];g.beginPath();g.moveTo(0,yy-26);g.lineTo(-w,yy+22);g.lineTo(w,yy+22);g.fill();g.strokeStyle='#7eaa58';g.lineWidth=2;g.beginPath();g.moveTo(-w*.65,yy+10);g.lineTo(0,yy-17);g.stroke()}g.restore()}
function flower(x,y){for(let i=0;i<5;i++){let a=i*Math.PI*2/5;ellipse(x+Math.cos(a)*4,y+Math.sin(a)*4,3,2,i%2?'#ffe3c5':'#f9a9c8')}ellipse(x,y,2,2,'#fbe68a')}
function torch(x,y){g.fillStyle='#584b38';g.fillRect(x-7,y-5,14,22);g.fillStyle='#e0b47a';g.fillRect(x-11,y-9,22,8);g.shadowColor='#ffb72b';g.shadowBlur=18;ellipse(x,y-20,7,15,'#ffab24');ellipse(x,y-22,4,9,'#fff6a1');g.shadowBlur=0}
function fence(x,y){g.strokeStyle='#6b4525';g.lineWidth=7;g.beginPath();g.moveTo(x-32,y);g.lineTo(x+32,y);g.moveTo(x-32,y-13);g.lineTo(x+32,y-13);g.stroke();for(let j of [-25,0,25]){g.fillStyle='#b68b4e';g.fillRect(x+j-4,y-22,8,31);g.fillStyle='#ead18a';g.fillRect(x+j-4,y-22,8,4)}}
function tent(x,y){ellipse(x,y+25,55,18,'#223e2d99');g.fillStyle='#68442c';g.beginPath();g.moveTo(x-48,y+22);g.lineTo(x,y-45);g.lineTo(x+50,y+22);g.closePath();g.fill();g.fillStyle='#d6b58b';g.beginPath();g.moveTo(x-48,y+22);g.lineTo(x,y-45);g.lineTo(x+5,y+22);g.closePath();g.fill();g.strokeStyle='#fff0bf';g.lineWidth=2;g.beginPath();g.moveTo(x,y-45);g.lineTo(x+5,y+22);g.stroke();ellipse(x+63,y+20,15,7,'#e97320');torch(x+63,y+5)}
function bridge(x,y){g.save();g.translate(x,y);g.rotate(-.24);g.fillStyle='#69472b';g.fillRect(-52,-22,104,44);for(let i=-48;i<50;i+=12){g.fillStyle=i%3?'#b98950':'#d6a369';g.fillRect(i,-19,10,38)}g.strokeStyle='#e4c68a';g.lineWidth=5;g.beginPath();g.moveTo(-52,-30);g.lineTo(52,-30);g.moveTo(-52,30);g.lineTo(52,30);g.stroke();g.restore()}
function waterfall(x,y){g.fillStyle='#316b8a';g.beginPath();g.moveTo(x-42,y-15);g.lineTo(x+35,y-15);g.lineTo(x+60,y+68);g.lineTo(x-58,y+68);g.fill();for(let i=0;i<9;i++){g.strokeStyle=i%2?'#c9f9ff':'#58c8ec';g.lineWidth=3+rand(i,22)*5;g.beginPath();g.moveTo(x-35+i*8,y-10);g.bezierCurveTo(x-35+i*8,y+15,x-45+i*10,y+36,x-42+i*10,y+57);g.stroke()}ellipse(x,y+60,60,12,'#b1f4f3aa')}
function paintedScenery(){g.fillStyle='#568a38';g.fillRect(0,0,W,H);for(let i=0;i<1800;i++){let x=rand(i,33)*W,y=rand(i,34)*H,r=rand(i,35);ellipse(x,y,2+r*13,1+r*5,r>.5?'#86b64b33':'#2c673c22')}g.fillStyle='#1c6477';g.beginPath();g.moveTo(0,680);g.bezierCurveTo(230,618,365,735,575,673);g.bezierCurveTo(805,615,945,728,1200,642);g.lineTo(1200,700);g.lineTo(0,700);g.fill();for(let i=0;i<48;i++){let x=i*27,y=678+Math.sin(i*1.35)*12;ellipse(x,y,12,2,'#b8f3e866')}waterfall(310,17);for(let i=0;i<145;i++){let x=rand(i,40)*W,y=rand(i,41)*H,k=rand(i,42);if(nearRoad(x,y,76)||x>1000&&y>230&&y<480||y>640||x<80&&y>65&&y<630)continue;if(k<.35)rock(x,y,.35+rand(i,43)*.75);else if(k<.65)fir(x,y,.38+rand(i,44)*.5);else if(k<.87)tree(x,y,.35+rand(i,45)*.48,k>.82);else for(let j=0;j<5;j++)flower(x+rand(i,j)*28-14,y+rand(j,i)*24-12)}for(let i=0;i<100;i++){let x=rand(i,51)*W,y=rand(i,52)*H;if(!nearRoad(x,y,80)&&y<630)flower(x,y)}tent(940,100);bridge(860,658);fence(205,58);fence(715,625);fence(1050,560)}
function fancyRoad(p){line(p,85,'#3e7037');line(p,77,'#6d8c3f');line(p,69,'#9a7648');line(p,64,'#c99658');line(p,56,'#edbc78');for(let [a,b] of segments(p)){let d=Math.hypot(b[0]-a[0],b[1]-a[1]);for(let k=0;k<d;k+=13){let t=k/d,x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;let seed=Math.floor(x*2+y*3);ellipse(x+(rand(seed,11)-.5)*39,y+(rand(seed,12)-.5)*34,1+rand(seed,13)*3,1.3,rand(seed,14)>.5?'#fff0c0aa':'#9e794d88')}}}
function paintedCrystal(x,y){ellipse(x,y+32,81,30,'#163d43aa');for(let i=0;i<4;i++)ellipse(x,y+35-i*8,78-i*10,29-i*3,i%2?'#b5a891':'#53636c');for(let a=0;a<6;a++){let q=a*Math.PI/3;rock(x+Math.cos(q)*60,y+Math.sin(q)*29,.45)}g.shadowColor='#2ad5ff';g.shadowBlur=45;g.fillStyle='#2ee0ff';g.beginPath();g.moveTo(x,y-100);g.lineTo(x+36,y-38);g.lineTo(x+20,y+24);g.lineTo(x,y+48);g.lineTo(x-32,y+12);g.lineTo(x-36,y-39);g.closePath();g.fill();g.strokeStyle='#e4ffff';g.lineWidth=4;g.stroke();g.beginPath();g.moveTo(x,y-100);g.lineTo(x,y+48);g.lineTo(x+36,y-38);g.stroke();g.shadowBlur=0}
function paintedDraw(){paintedScenery();for(let p of roads())fancyRoad(p);grid();let m=maps[level-1];for(let i=0;i<3;i++){let y=m.routes[i][0][1]-38;gate(45,y,'ABC'[i]);torch(85,y-17)}if(level===2){ellipse(345,220,46,28,'#c8a572');fence(350,167)}paintedCrystal(...m.crystal);for(let b of build){ellipse(b.x,b.y+15,27,10,'#163923aa');if(b.type==='tower'){g.fillStyle='#c8b9a0';g.fillRect(b.x-19,b.y-24,38,47);g.fillStyle='#ad4833';g.beginPath();g.moveTo(b.x-28,b.y-24);g.lineTo(b.x,b.y-59);g.lineTo(b.x+28,b.y-24);g.fill();g.strokeStyle='#e9b56d';g.lineWidth=3;g.stroke();g.fillStyle='#ffdd75';g.fillRect(b.x-6,b.y-17,12,14)}else{g.fillStyle='#a5a89c';g.fillRect(b.x-9,b.y-38,18,77);g.fillStyle='#e0ddca';for(let k=-30;k<36;k+=16)g.fillRect(b.x-10,b.y+k,20,5)}}}
draw=paintedDraw;
draw();
</script></html>
